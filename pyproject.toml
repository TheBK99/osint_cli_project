[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-cli"
version = "0.1.0"
description = "Local-first OSINT investigation CLI for claim verification and intelligence workflows"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "OSINT CLI" }]
dependencies = [
  "typer>=0.12.3",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.3",
  "playwright>=1.45.0",
  "spacy>=3.7.4",
  "networkx>=3.3",
  "python-whois>=0.9.4",
  "dnspython>=2.6.1",
  "Pillow>=10.3.0",
  "imagehash>=4.3.1",
  "structlog>=24.2.0",
  "snscrape>=0.7.0.20230622",
  "tabulate>=0.9.0"
]

[project.scripts]
osint = "osint_cli.main:app"

[tool.setuptools]
packages = ["osint_cli", "osint_cli.core", "osint_cli.utils", "osint_cli.models"]

[tool.setuptools.package-data]
osint_cli = ["data/*.json"]
